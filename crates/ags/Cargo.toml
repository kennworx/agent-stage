[package]
name = "ags"
version.workspace = true
edition.workspace = true
description = "Turn agent-authored markdown reasoning into an interactive in-browser review page"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
ags-feedback = { version = "0.1.0", path = "../ags-feedback" }
ags-mermaid = { version = "0.1.0", path = "../ags-mermaid" }
ags-render = { version = "0.1.0", path = "../ags-render" }
# default features pull serde (via argh_shared) into the runtime tree; keep only
# `help` so `--help` text still generates but nothing serializes.
argh = { version = "0.1", default-features = false, features = ["help"] }
serde_json = "1.0.150"
tiny_http = "0.12.0"

[lints]
workspace = true
