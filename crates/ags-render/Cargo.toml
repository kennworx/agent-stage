[package]
name = "ags-render"
version.workspace = true
edition.workspace = true
description = "Render an agent-authored markdown artifact — prose and every block type — to a reviewable HTML page"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
tl = "0.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toon-rs = "2.1.0"
comrak = { version = "0.52", default-features = false }
ags-feedback = { version = "0.1.0", path = "../ags-feedback" }
ags-mermaid = { version = "0.1.0", path = "../ags-mermaid" }

[lints]
workspace = true
