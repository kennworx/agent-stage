[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kennworx/agent-stage"
homepage = "https://github.com/kennworx/agent-stage"

[profile.release]
opt-level = 3
strip = true

# Shipping a diagram renderer into a page is a different problem from running one
# on a command line: nobody waits for a CLI to download. `opt-level = 3` above
# unrolls and inlines for speed and costs a third of the module in bytes, which is
# the wrong trade when the module has to arrive before anything is drawn.
#
#     cargo build -p ags-mermaid-wasm --target wasm32-unknown-unknown \
#         --profile wasm-release
#
# Measured on this crate, rendering the 117-diagram gallery in Node, output
# byte-identical at every level. Sizes are decimal KB, which is what a browser
# reports — 721 KB here is 704 KiB on disk, and confusing the two is how a number
# in a document stops matching the one in DevTools.
#
#     opt-level   after wasm-opt -Oz     gzip -9    per diagram
#     z  (used)              721 KB      308 KB       ~0.25 ms
#     s                      909 KB      371 KB       ~0.24 ms
#     2                     1018 KB      405 KB       ~0.19 ms
#     3  (--release)        1080 KB      424 KB       ~0.20 ms
#
# The timings are noisy — `s` moved 16% between runs — so read them as "all within
# a few tens of microseconds a diagram" rather than as a ranking. Nothing here is
# large enough for speed to decide: a page with ten diagrams spans 0.6 ms across
# the whole table, while `z` saves 116 KB on every load.

[profile.wasm-release]
inherits = "release"
# Size over speed. The renderer's work is bounded by the diagram, not the machine.
opt-level = "z"
# Whole-program, single unit: the dispatch reaches every diagram type, so anything
# genuinely unreachable can only be found by looking at the program at once.
lto = "fat"
codegen-units = 1
# No unwinding. A panic crossing the WebAssembly boundary aborts the instance
# regardless — the binding converts failures to messages precisely because an
# abort takes the page with it — so the landing pads were never going to run.
panic = "abort"
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Builders chain `-> Self`; requiring #[must_use] on every setter is noise.
return_self_not_must_use = "allow"
must_use_candidate = "allow"

# Stricter opt-in lints (https://emschwartz.me/your-clippy-config-should-be-stricter/)
# Don't panic
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"
# Don't fail silently
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"
# Async safety
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
if_let_mutex = "warn"
large_futures = "warn"
# Memory safety
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"
# Numeric correctness
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"
# General best practices
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"
# Suppression discipline
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
